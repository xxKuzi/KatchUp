# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

# Environment variables and secrets.
env:
  # Database
  - variable: DATABASE_URL
    secret: db-url

  # Auth.js / NextAuth
  - variable: AUTH_SECRET
    secret: auth-secret
  - variable: AUTH_URL
    value: "https://katchup.jakubkuzel.com"
  - variable: AUTH_GOOGLE_ID
    value: "713537066564-muh9k9k9grlnni8jj7aodtu91tocbp1s.apps.googleusercontent.com"
  - variable: AUTH_GOOGLE_SECRET
    secret: auth-google-secret
  - variable: AUTH_GITHUB_ID
    value: "Ov23li14mOjj2c0c4tCw"
  - variable: AUTH_GITHUB_SECRET
    secret: auth-github-secret
  - variable: AUTH_DISCORD_ID
    value: "1529928224535089402"
  - variable: AUTH_DISCORD_SECRET
    secret: auth-discord-secret

  # Redis
  # Shared with local development — the same database backs both, so keys
  # written while testing land in the live keyspace. Energy, ad tickets and
  # idempotency keys are all scoped per user, which keeps that survivable.
  - variable: UPSTASH_REDIS_REST_URL
    value: "https://star-burro-188578.upstash.io"
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: redis-token

  # AI deck generation
  - variable: GEMINI_API_KEY
    secret: gemini-api-key

  # Pusher
  - variable: PUSHER_APP_ID
    value: "2141801"
  - variable: PUSHER_KEY
    value: "034e8cfe39f236780f4b"
  - variable: PUSHER_SECRET
    secret: pusher-secret
  - variable: PUSHER_CLUSTER
    value: "eu"
  - variable: NEXT_PUBLIC_PUSHER_KEY
    value: "034e8cfe39f236780f4b"
  - variable: NEXT_PUBLIC_PUSHER_CLUSTER
    value: "eu"

  # Google Ad Placement API (AdSense H5 Games Ads)
  # The publisher id is public by design: it identifies the site, not the
  # player. Both land in the client bundle at build time, so a change needs a
  # redeploy, not a restart. Leave the client empty and the "watch an ad"
  # button isn't offered at all.
  #
  # TEST is deliberately "on" and the client id is deliberately a placeholder:
  # AdSense approval and H5 Games Ads allowlisting haven't come back yet, so
  # there are no real ads to serve. Test mode fakes the callbacks in the
  # browser, which means energy is paid out for a video nobody watched — an
  # acceptable trade while the only player is us. Both values change together
  # once the real publisher id arrives.
  - variable: NEXT_PUBLIC_ADSENSE_CLIENT
    value: "ca-pub-0000000000000000"
  - variable: NEXT_PUBLIC_ADSENSE_TEST
    value: "on"
